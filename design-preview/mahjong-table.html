<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一局 · 立直麻将牌桌</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f8f2;color:#304838;font:14px Arial,'Microsoft YaHei',sans-serif}main{max-width:1040px;margin:25px auto;padding:0 15px}h1{font-size:26px}p{font-size:12px;color:#7c8b71;line-height:1.8}button{cursor:pointer;font:inherit;border:1px solid #d0dcc4;border-radius:9px;padding:10px 16px;background:#edf2e4;color:#355a40}.primary{background:#355d43;color:white}.desk{position:relative;width:100%;aspect-ratio:1.12;background:radial-gradient(ellipse,#edf3e4,#d9e6ce);border:1px solid #ccd9be;border-radius:26px;min-height:650px}.player{position:absolute;display:flex;align-items:center;gap:10px;font-size:12px;transform:translate(-50%,-50%)}.player small{display:block;color:#7c8c6e;font-size:10px;margin-top:4px}.avatar{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#ded7ec;font-size:20px}.self .avatar{background:#d6e8c1;outline:3px solid #7a995e;outline-offset:3px}.north{left:50%;top:7%}.west{left:9%;top:46%;flex-direction:column;text-align:center}.east{left:91%;top:46%;flex-direction:column;text-align:center}.self{left:50%;top:80%}.river{position:absolute;display:grid;grid-template-columns:repeat(6,32px);grid-auto-rows:43px;gap:4px;transform:translate(-50%,-50%);padding:9px;border-radius:9px;background:#c9d8ba55;min-height:104px}.river.n{left:50%;top:25%;transform:translate(-50%,-50%) rotate(180deg)}.river.w{left:26%;top:47%;transform:translate(-50%,-50%) rotate(90deg)}.river.e{left:74%;top:47%;transform:translate(-50%,-50%) rotate(-90deg)}.river.s{left:50%;top:68%}.tile{position:relative;width:32px;height:43px;padding:1px;border:1px solid #e0dfcd;border-bottom:4px solid #799971;border-radius:4px;background:linear-gradient(110deg,#fffef7,#f6f3e3);box-shadow:0 2px 3px #3a51362b;flex-shrink:0;display:grid;place-items:center}.tile svg{width:100%;height:100%}.tile.sideways{width:43px;height:32px;transform:rotate(-90deg);transform-origin:center;align-self:center;justify-self:center}.tile.sideways svg{transform:rotate(90deg)}.center{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);text-align:center;background:#c5d7b7;border:1px solid #b6c9a6;padding:16px 10px;border-radius:14px;width:180px}.center strong{font-size:18px}.center small{display:block;margin:7px 0;font-size:10px;color:#6e815e}.indicator{display:flex;justify-content:center;align-items:center;gap:8px;font-size:10px}.hand{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);display:flex;gap:4px;max-width:96%;overflow:auto;padding:15px 4px 8px}.hand .tile{width:43px;height:59px;flex:0 0 43px}.hand .tile:last-child{margin-left:10px}.tile.selected{transform:translateY(-10px);outline:2px solid #648948}.actions{display:flex;justify-content:center;gap:10px;margin:20px}.note{background:#fff;border:1px solid #e0e6d6;padding:16px;border-radius:12px;font-size:12px;line-height:1.8}.backs{position:absolute;left:50%;top:13%;transform:translateX(-50%);display:flex;gap:2px}.backs i{width:13px;height:22px;background:#648873;border:1px solid #eef1e5;border-radius:2px}.riichi-stick{height:6px;background:#fffdf0;border:1px solid #d6d4c8;border-radius:3px;position:absolute;width:86px;left:50%;top:58%;transform:translateX(-50%);display:none}.riichi-stick:after{content:'';width:5px;height:5px;border-radius:50%;background:#b44940;display:block;margin:auto}.scroll{overflow:auto}.hint{font-size:11px;text-align:center;color:#829371;margin:10px}button:focus-visible{outline:3px solid #7b975b}@media(max-width:680px){.desk{min-width:650px;min-height:650px}.scroll{border-radius:20px}h1{font-size:23px}.actions{flex-wrap:wrap}.center{width:145px;padding:12px 5px}.hand .tile{width:36px;flex-basis:36px;height:50px}}</style><main><h1>四人立直麻将</h1><p>牌面与独立牌河预览 · 可选牌弃牌、模拟立直。手机可横向滑动查看完整牌桌。</p><div class="scroll"><div class="desk"><div class="player north"><span class="avatar">青</span><span>青山<small>西家 · 25000 点</small></span></div><div class="backs" id="backs"></div><div class="player west"><span class="avatar" style="background:#ead9c6">晚</span><span>晚风<small>北家 · 25000 点</small></span></div><div class="player east"><span class="avatar" style="background:#cbdfe4">小</span><span>小树林<small>南家 · 25000 点</small></span></div><div class="river n" id="r2"></div><div class="river w" id="r3"></div><div class="river e" id="r1"></div><div class="river s" id="r0"></div><div class="center"><strong>东一局</strong><small>0 本场 · 余牌 54</small><small id="pot">供托 0</small><div class="indicator">宝牌指示<span id="indicator"></span></div></div><div class="riichi-stick" id="stick"></div><div class="player self"><span class="avatar">道</span><span>道口的猫<small id="score">你 · 东家 · 25000 点</small></span></div><div class="hand" id="hand"></div></div></div><div class="actions"><button class="primary" id="discard">打出选中牌</button><button id="riichi">立直并打出选中牌</button><button id="reset">重置预览</button></div><div class="note" id="message" role="status">每家弃牌独立摆放，每行 6 张。点击手牌可查看牌名；立直演示会将宣言牌横置，并显示供托棒。此预览不校验听牌或计分规则。</div></main><script>
function face(t){const suit=t[0],n=+t[1];let shapes='';if(suit==='p'){const positions={1:[[25,32]],2:[[25,17],[25,47]],3:[[14,15],[25,32],[36,49]],4:[[14,17],[36,17],[14,47],[36,47]],5:[[14,15],[36,15],[25,32],[14,49],[36,49]],6:[[14,13],[36,13],[14,32],[36,32],[14,51],[36,51]],7:[[12,11],[25,11],[38,11],[14,30],[36,30],[14,50],[36,50]],8:[[14,10],[36,10],[14,24],[36,24],[14,39],[36,39],[14,53],[36,53]],9:[[12,12],[25,12],[38,12],[12,32],[25,32],[38,32],[12,52],[25,52],[38,52]]}[n];shapes=positions.map(([x,y],i)=>'<circle cx="'+x+'" cy="'+y+'" r="'+(n===1?14:5)+'" fill="none" stroke="'+(n===1||i%3===1?'#b94f43':'#334f76')+'" stroke-width="2.3"/><circle cx="'+x+'" cy="'+y+'" r="'+(n===1?8:1.5)+'" fill="#3b6c53"/>').join('')}else if(suit==='s'){if(n===1){shapes='<path d="M15 54 Q30 47 20 30 Q13 18 26 10 Q33 9 36 17 L43 20 L35 23 Q32 32 37 38 L30 50 Z" fill="#317355"/><path d="M22 29 Q9 26 10 42 Q19 37 25 44" fill="#41618a"/><circle cx="31" cy="16" r="2" fill="#bb5145"/><path d="M23 49 L18 59 M29 49 L28 60" stroke="#b95742" stroke-width="2"/>'}else{for(let i=0;i<n;i++){const cols=n<=3?1:n<=6?2:3,rows=Math.ceil(n/cols),x=25+(i%cols-(cols-1)/2)*13,y=32+(Math.floor(i/cols)-(rows-1)/2)*18;shapes+='<path d="M'+x+' '+(y-6)+'v12 M'+(x-4)+' '+(y-5)+'h8 M'+(x-4)+' '+y+'h8 M'+(x-4)+' '+(y+5)+'h8" stroke="'+(n===5&&i===4?'#b35043':'#286548')+'" stroke-width="3" stroke-linecap="round"/>'}}}else if(suit==='m'){shapes='<text x="25" y="27" text-anchor="middle" font-size="24" fill="#304d61">'+['','一','二','三','四','五','六','七','八','九'][n]+'</text><text x="25" y="56" text-anchor="middle" font-size="27" fill="#b34d40">萬</text>'}else{shapes=n===5?'<rect x="8" y="9" width="34" height="47" rx="2" fill="none" stroke="#496885" stroke-width="2"/>':'<text x="25" y="47" text-anchor="middle" font-size="38" fill="'+(n===6?'#2d7451':n===7?'#b74a40':'#304c60')+'">'+['','東','南','西','北','白','發','中'][n]+'</text>'}return '<svg viewBox="0 0 50 65" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" font-family="serif">'+shapes+'</svg>'}
function label(t){return t[0]==='z'?['','东','南','西','北','白','发','中'][+t[1]]:t[1]+({m:'万',p:'筒',s:'索'}[t[0]])}function tile(t,button=false){const e=document.createElement(button?'button':'span');e.className='tile';e.innerHTML=face(t);e.setAttribute('aria-label',label(t));e.title=label(t);return e}let selected=null,riichi=false;function reset(){selected=null;riichi=false;document.getElementById('stick').style.display='none';document.getElementById('pot').textContent='供托 0';document.getElementById('score').textContent='你 · 东家 · 25000 点';[['z4','m9','p1'],['z3','s9','p8','z7'],['m1','p3','z2','s1'],['p9','s2','m8']].forEach((ts,i)=>{const r=document.getElementById('r'+i);r.replaceChildren(...ts.map(t=>tile(t)))});document.getElementById('indicator').replaceChildren(tile('m4'));document.getElementById('hand').replaceChildren(...['m1','m2','m3','m4','m5','m6','p2','p3','p4','s5','s6','s7','z5','z5'].map(t=>{const e=tile(t,true);e.dataset.tile=t;e.onclick=()=>{document.querySelectorAll('#hand .tile').forEach(x=>x.classList.remove('selected'));selected=e;e.classList.add('selected');document.getElementById('message').textContent='已选 '+label(t)+'。弃牌会放到你面前的牌河。'};return e}));document.getElementById('riichi').disabled=false}function discard(declare){if(!selected){document.getElementById('message').textContent='请先选择一张手牌。';return}const e=tile(selected.dataset.tile);if(declare){e.classList.add('sideways');e.setAttribute('aria-label',label(selected.dataset.tile)+'，立直宣言牌');riichi=true;document.getElementById('stick').style.display='block';document.getElementById('pot').textContent='供托 1000';document.getElementById('score').textContent='你 · 东家 · 24000 点';document.getElementById('riichi').disabled=true}document.getElementById('r0').append(e);selected.remove();selected=null;document.getElementById('message').textContent=declare?'立直示意：宣言牌横放在自己的牌河中，供托增加1000点。':'已放入你面前的牌河，其他三家的弃牌保持独立。'}document.getElementById('discard').onclick=()=>discard(false);document.getElementById('riichi').onclick=()=>discard(true);document.getElementById('reset').onclick=reset;document.getElementById('backs').innerHTML='<i></i>'.repeat(13);reset();
</script></html>
