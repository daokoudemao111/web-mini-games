<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一局 · 条子牌面比较</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f8f1;color:#304c3b;font:14px Arial,'Microsoft YaHei',sans-serif}main{max-width:1120px;margin:auto;padding:35px 20px}h1{font-size:27px}p{font-size:13px;color:#7d8c76;line-height:1.8}section{border:1px solid #dce4d7;background:white;border-radius:20px;overflow:hidden;margin-top:24px}header{padding:22px 25px}h2{font-size:20px;margin:0 0 8px}header p{margin:0}.stage{background:#e5edeb;padding:24px}.row{display:flex;gap:14px;overflow:auto;padding:14px 4px}.item{text-align:center;flex-shrink:0}.item small{display:block;margin-top:12px;font-size:11px;color:#829080}.tile{background:#fffefa;border:1px solid #e0e5df;border-bottom:6px solid #75aaa7;border-radius:11px;box-shadow:0 3px 0 #ccddda,0 5px 7px #34595112;padding:4px;width:78px;height:108px;cursor:pointer}.tile svg{height:100%;width:100%}.tile.on{transform:translateY(-8px);outline:2px solid #70935c}.mini .tile{width:34px;height:46px;border-radius:5px;border-bottom-width:3px;padding:1px}.mini{gap:8px}.label{font-size:11px;color:#82917c;margin-top:14px}.footer{margin-top:25px;font-size:13px;line-height:1.8;color:#7e8b73}button:focus-visible{outline:3px solid #698b54;outline-offset:3px}@media(max-width:600px){main{padding:22px 12px}.stage{padding:15px}.tile{width:64px;height:90px}.row{gap:10px}header{padding:18px}}</style><main><h1>B 牌型 · 条子重新设计</h1><p>只比较索子图案，保留已选的白底青边。每版包含一条到九条，下方是缩小后的牌河效果。点击牌面可选中。</p><div id="samples"></div><p class="footer">可以单独挑一条的鸟形，再搭配另一版的二到九条竹节。</p></main><script>
const layouts={2:[[30,18],[30,64]],3:[[30,12],[30,41],[30,70]],4:[[16,20],[44,20],[16,62],[44,62]],5:[[15,16],[45,16],[30,41],[15,66],[45,66]],6:[[16,13],[44,13],[16,41],[44,41],[16,69],[44,69]],7:[[30,9],[16,33],[44,33],[16,51],[44,51],[16,70],[44,70]],8:[[16,12],[44,12],[16,31],[44,31],[16,51],[44,51],[16,70],[44,70]],9:[[12,13],[30,13],[48,13],[12,41],[30,41],[48,41],[12,69],[30,69],[48,69]]};
function bird(v){if(v===0)return '<path d="M26 43 C9 55 13 68 7 75 C23 68 36 57 38 46" fill="#256451"/><path d="M29 39 C37 29 30 22 35 15 C41 11 45 18 42 23 L49 24 L42 28 C42 43 47 48 39 57 C27 61 19 52 22 45Z" fill="#267454"/><path d="M26 39 C9 35 13 56 31 54 C25 47 23 44 26 39" fill="#345e81"/><path d="M25 40 Q15 42 25 51 M30 59 L27 72 M36 58 L38 71" fill="none" stroke="#c65c49" stroke-width="2"/><circle cx="39" cy="20" r="1.5" fill="#fff"/>';
if(v===1)return '<path d="M13 66 Q27 54 24 44 Q15 38 23 30 Q29 24 37 28 Q42 22 38 15 Q44 16 45 24 L51 28 L44 31 Q43 50 32 57Z" fill="#29826e"/><path d="M23 36 Q8 34 14 49 Q18 57 30 52 Q20 47 23 36" fill="#74b3a0"/><path d="M17 64 L9 74 L25 65" fill="#327b79"/><path d="M31 55 L31 70 L37 70" stroke="#ba8650" stroke-width="2" fill="none"/><circle cx="40" cy="25" r="1.5" fill="#fff"/>';
return '<path d="M10 70 Q33 61 33 43 L26 28 Q28 15 37 12 L43 19 L39 26 L48 29 L39 32 Q50 46 38 58 L25 67Z" fill="#185c43"/><path d="M25 34 Q11 33 13 51 L32 55 L26 45Z" fill="#316b99"/><path d="M18 43 L28 48 M19 48 L30 52" stroke="#dbe9c8" stroke-width="2"/><path d="M26 63 L24 74 M34 60 L37 72" stroke="#b74436" stroke-width="2"/><circle cx="36" cy="20" r="2" fill="#fff"/>'}
function face(n,v){let content='';if(n===1)content=bird(v);else layouts[n].forEach(([x,y],i)=>{const red=(n===5&&i===2)||(n===7&&i===0)||(n===9&&i%3===1);const color=red?'#b24d45':v===1?'#348575':'#28664b';const height=n>=7?15:20,w=v===2?8:7;const top=y-height/2;
if(v===0)content+='<rect x="'+(x-w/2)+'" y="'+top+'" width="'+w+'" height="'+height+'" rx="2" fill="'+color+'"/><path d="M'+(x-w/2-1)+' '+(y-4)+'h'+(w+2)+' M'+(x-w/2-1)+' '+(y+4)+'h'+(w+2)+'" stroke="'+color+'" stroke-width="2.4" stroke-linecap="round"/><path d="M'+(x-1)+' '+(top+2)+'v'+(height-4)+'" stroke="#fff9" stroke-width="1.1"/>';
if(v===1)content+='<rect x="'+(x-4)+'" y="'+top+'" width="8" height="'+height+'" rx="3" fill="'+color+'"/><path d="M'+(x-3)+' '+(y-3)+'h6 M'+(x-3)+' '+(y+4)+'h6" stroke="#fffbcf" stroke-width="1.8"/><path d="M'+(x-1.6)+' '+(top+2)+'v3" stroke="#fff8" stroke-width="1.5" stroke-linecap="round"/>';
if(v===2)content+='<path d="M'+(x-4)+' '+top+'h8v'+height+'h-8Z" fill="'+color+'"/><path d="M'+(x-5)+' '+(top+2)+'h10 M'+(x-5)+' '+(y)+'h10 M'+(x-5)+' '+(top+height-2)+'h10" stroke="'+color+'" stroke-width="3"/><path d="M'+(x-2)+' '+(top+3)+'v'+(height-6)+'" stroke="#fffbe6" stroke-width="1.4"/>';
});return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 82" aria-hidden="true">'+content+'</svg>'}
const variants=[['B1 · 传统竹节','细长竹节、深绿配朱红，一条采用传统鸟形，保留牌面的细节。'],['B2 · 圆润青竹','竹节更圆润，浅色分节线更简洁，一条采用柔和的青色鸟形。'],['B3 · 清晰粗竹','竹节加粗、节头更明显，一条轮廓更硬朗，便于小尺寸辨认。']];variants.forEach(([name,desc],v)=>{const s=document.createElement('section');s.innerHTML='<header><h2>'+name+'</h2><p>'+desc+'</p></header><div class="stage"><div class="row large"></div><div class="label">牌河小尺寸效果</div><div class="row mini"></div></div>';for(let n=1;n<=9;n++){const item=document.createElement('div');item.className='item';const b=document.createElement('button');b.className='tile';b.innerHTML=face(n,v);b.setAttribute('aria-label',name+' '+n+'条');b.setAttribute('aria-pressed','false');b.onclick=()=>{b.classList.toggle('on');b.setAttribute('aria-pressed',String(b.classList.contains('on')))};item.append(b);const label=document.createElement('small');label.textContent=n+' 条';item.append(label);s.querySelector('.large').append(item);const small=document.createElement('div');small.className='tile';small.innerHTML=face(n,v);s.querySelector('.mini').append(small)}document.getElementById('samples').append(s)});
</script></html>
