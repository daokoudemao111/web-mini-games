<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一局 · 扑克牌样式选择</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f0;color:#294336;font-family:Arial,'Microsoft YaHei',sans-serif}main{max-width:1160px;margin:auto;padding:48px 24px}header small{letter-spacing:3px;color:#7d8c78}h1{font-size:32px;margin:14px 0}p{color:#778172;line-height:1.8;font-size:14px}section{background:white;border:1px solid #e0e5d9;border-radius:22px;margin-top:28px;overflow:hidden}.heading{padding:24px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px}h2{font-size:20px;margin:0 0 7px}.heading p{margin:0;font-size:12px}.badge{font-size:12px;border-radius:30px;padding:8px 14px;background:#edf2e5;white-space:nowrap}.table{background:#e8ede1;padding:24px 28px 30px}.label{font-size:11px;color:#6e7f67;letter-spacing:1px;margin:0 0 20px}.cards{display:flex;gap:9px;overflow-x:auto;padding:17px 4px 18px}.card{position:relative;flex-shrink:0;width:84px;height:122px;border:1px solid #d8dacd;border-radius:9px;background:#fffdf8;color:#263d32;box-shadow:0 3px 5px #25361c18;cursor:pointer;transition:transform .15s,box-shadow .15s;padding:0}.card.red{color:#c65049}.card.selected{transform:translateY(-13px);outline:3px solid #648756;box-shadow:0 9px 12px #24402d20}.corner{position:absolute;left:8px;top:7px;font:700 24px Georgia;line-height:1}.corner i{display:block;font-style:normal;font-size:19px;margin-top:3px}.bottom{left:auto;top:auto;right:8px;bottom:7px;transform:rotate(180deg)}.symbol{font-size:42px}.joker .corner{font:700 12px Arial;writing-mode:vertical-rl;letter-spacing:2px}.joker .symbol{font-size:34px}.joker-word{position:absolute;bottom:18px;left:0;right:0;font:9px Arial;letter-spacing:2px}.modern .table{background:#eef0e6}.modern .card{border:0;background:#fffdf5;border-radius:14px;box-shadow:0 4px 0 #dce2d1,0 8px 12px #3141240b}.modern .corner{font:700 28px Arial;top:13px;left:12px}.modern .corner i{font-size:15px}.modern .bottom{display:none}.modern .symbol{position:absolute;right:11px;bottom:12px;font-size:35px;opacity:.8}.modern .joker .corner{writing-mode:horizontal-tb;font:700 15px Arial}.modern .joker-word{bottom:13px;left:10px;right:auto;writing-mode:vertical-rl;font-size:8px}.modern .red{color:#bd715c}.bold .table{background:#dce9de}.bold .card{background:linear-gradient(135deg,#fff,#f5f6ed);border:2px solid #fff;border-bottom:4px solid #bec9b7;border-radius:10px;box-shadow:0 5px 8px #233f3026}.bold .corner{font:900 32px Arial;left:8px;top:8px;text-shadow:0 1px 0 #fff}.bold .corner i{font-size:21px}.bold .bottom{display:none}.bold .symbol{position:absolute;right:7px;bottom:9px;font-size:48px}.bold .red{color:#dc4039}.bold .joker .corner{font-size:18px;writing-mode:horizontal-tb}.bold .joker .symbol{font-size:45px}.bold .joker-word{bottom:47px;font-size:8px;left:auto;right:7px}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:7px;gap:10px}.status{font-size:12px;color:#65755e}.reset{border:1px solid #c8d3c0;background:#ffffff88;color:#39533d;border-radius:8px;padding:8px 13px;cursor:pointer}.sample{display:flex;align-items:center;gap:13px;margin-top:26px;padding:20px;background:#fff;border-radius:16px;flex-wrap:wrap}.avatar{width:43px;height:43px;display:grid;place-items:center;background:#dfd3ed;border-radius:14px;font-weight:bold}.avatar.active{background:#d2e4bd;outline:3px solid #63834f;outline-offset:3px}.sample small{color:#788471;margin-right:12px}.card:focus-visible{outline:3px solid #456e36}@media(max-width:600px){main{padding:28px 14px}.heading{padding:20px}.table{padding:15px}.badge{display:none}.card{width:70px;height:104px}.cards{gap:7px}.corner{font-size:21px}.symbol{font-size:35px}h1{font-size:26px}}
</style><main><header><small>YIJU / DESIGN STUDY 01</small><h1>哪一副牌，更合你的手感？</h1><p>三种设计使用相同牌组。点击牌面试试选中效果，可横向滑动查看整排。<br>这里只预览外观，不会改变现有游戏。</p></header><div id="options"></div><div class="sample"><span class="avatar active">道</span><small>道口的猫 · 轮到操作</small><span class="avatar">道</span><small>道旁小树 · 等待</small><span style="font-size:12px">头像方向示意：首字相同，用底色区分，高亮标记当前玩家。</span></div></main><script>
const designs=[['classic','A · 经典实体牌','对角点数与花色，贴近真实扑克牌，红黑清晰。','经典耐看'],['modern','B · 清爽现代牌','奶油底色、柔和红色、大点数与留白，搭配现在的网页。','推荐 · 风格统一'],['bold','C · 休闲棋牌牌','更粗的点数、更鲜明的花色与立体边缘，小屏上醒目。','醒目易读']];const deck=[['大王','✦',true],['小王','✦',false],['2','♠',false],['A','♥',true],['A','♣',false],['K','♦',true],['Q','♠',false],['J','♥',true],['10','♣',false],['9','♦',true],['8','♠',false]];
for(const [cls,title,desc,badge] of designs){const section=document.createElement('section');section.className=cls;section.innerHTML=`<div class="heading"><div><h2>${title}</h2><p>${desc}</p></div><span class="badge">${badge}</span></div><div class="table"><div class="label">你的手牌 / 点击选择，多张可选</div><div class="cards"></div><div class="footer"><span class="status">已选择 0 张</span><button class="reset">取消选择</button></div></div>`;for(const [r,s,red] of deck){const joker=r.includes('王');const b=document.createElement('button');b.className='card'+(red?' red':'')+(joker?' joker':'');b.setAttribute('aria-label',r+s);b.setAttribute('aria-pressed','false');b.innerHTML=`<span class="corner">${r}${joker?'':`<i>${s}</i>`}</span><span class="symbol">${s}</span>${joker?'<span class="joker-word">JOKER</span>':`<span class="corner bottom">${r}<i>${s}</i></span>`}`;b.onclick=()=>{b.classList.toggle('selected');b.setAttribute('aria-pressed',String(b.classList.contains('selected')));update()};section.querySelector('.cards').append(b)}function update(){section.querySelector('.status').textContent='已选择 '+section.querySelectorAll('.selected').length+' 张'}section.querySelector('.reset').onclick=()=>{section.querySelectorAll('.selected').forEach(b=>{b.classList.remove('selected');b.setAttribute('aria-pressed','false')});update()};document.querySelector('#options').append(section)}
</script></html>
