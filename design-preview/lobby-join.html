y:flex;justify-content:center;align-items:center;gap:14px;margin:28px 0 8px}.self-player strong{font-size:14px}.self-player strong small{display:block;font-size:11px;font-weight:400;color:#7b8872;margin-top:6px}.hand-label{text-align:center;font-size:11px}.opponents{justify-content:space-between;margin:30px 0 18px;gap:40px}.opponents .nickname-avatar{margin:0 0 12px}.opponents .playing-card,.last-play .playing-card{width:46px;height:65px;padding:0;border-radius:7px}.opponents .card-corner,.last-play .card-corner{font-size:18px;top:7px;left:7px}.opponents .card-corner i,.last-play .card-corner i{font-size:13px;margin-top:3px}.opponents .card-symbol,.last-play .card-symbol{font-size:20px;right:5px;bottom:5px}.bottom-cards .playing-card{width:40px;height:55px;padding:0;border-radius:6px}.bottom-cards .card-corner{font-size:15px;top:6px;left:7px}.bottom-cards .card-corner i{font-size:12px;margin-top:3px}.bottom-cards .card-symbol{display:none}.opponents .joker .card-corner,.last-play .joker .card-corner,.bottom-cards .joker .card-corner{font-size:10px;letter-spacing:1px}.last-play{min-height:100px}.bid-area{min-height:100px}.board-actions{padding-top:7px}@media(max-width:650px){.card-table{padding:20px 15px}.hand .playing-card{width:74px;height:108px;flex-basis:74px}.hand .playing-card+.playing-card{margin-left:-40px}.hand .card-corner{font-size:24px}.hand .joker .card-corner{font-size:13px}.nickname-avatar{width:40px;height:40px;font-size:19px;border-radius:13px}.opponents{gap:15px}.seat{padding-top:22px}.hand{padding-top:26px}.card-symbol{font-size:30px}.opponents .played{gap:2px}.opponents .playing-card{width:38px;height:58px}}
.away-status{color:#ad7650;font-size:11px}

.join-banner{display:flex;align-items:center;justify-content:space-between;gap:30px;padding:26px 30px;margin:0 0 34px;background:#e8eedf;border:1px solid #d3dfc6;border-radius:18px;box-shadow:0 5px 18px #37532d07}.join-copy{display:flex;gap:16px;align-items:center}.join-icon{background:#fff9;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:28px;color:#557547;flex-shrink:0}.join-copy h2{font-size:20px;margin:0 0 8px}.join-copy p{font-size:12px;color:#75836c;margin:0;line-height:1.7}.join-form{display:flex;gap:10px;align-items:center;min-width:360px}.join-form input{margin:0;min-width:0;width:215px;height:50px;letter-spacing:2px;font-size:14px;background:#fffef9}.join-form button{height:50px;white-space:nowrap;font-size:14px;padding:0 22px;box-shadow:0 4px 9px #345b4320}.preview-note{margin:0 0 18px;color:#929a88;font-size:11px}.demo-status{font-size:12px;color:#345b43;min-height:18px;margin:-20px 0 25px}.lobby{padding-top:40px}.intro{margin-bottom:30px}.tag-preview{position:fixed;bottom:100px;right:18px;background:#fff;border:1px solid #d8dfd0;border-radius:10px;padding:10px 15px;font-size:11px;color:#77816c;z-index:12;box-shadow:0 4px 15px #23432212}.mobile-toggle{background:none;color:#345b43;text-decoration:underline;font-size:11px;padding:0;margin-left:12px}.phone{max-width:410px;margin:auto;border-left:1px solid #ddd;border-right:1px solid #ddd}.phone .topbar{padding:0 18px;height:72px}.phone .brand-sub,.phone .small-note{display:none}.phone .lobby{padding:28px 18px 160px}.phone h1{font-size:27px}.phone .intro p{font-size:12px;line-height:1.8}.phone .game-grid{grid-template-columns:1fr}.phone .join-banner{display:block;padding:20px}.phone .join-form{min-width:0;margin-top:20px;gap:8px}.phone .join-form input{width:100%;flex:1}.phone .join-form button{padding:0 16px}.phone .join-copy h2{font-size:18px}.phone .section-line>span{font-size:9px}.phone .join-top{padding:10px;font-size:11px}.phone .lobby-foot{flex-wrap:wrap}.phone .lobby-foot p{margin:0}.phone .dock-label{display:none}.phone .filter-dock{max-width:410px;margin:auto;padding:15px 10px}.phone .filters{width:100%;gap:6px}.phone .filters button,.phone .filters button:first-child{flex:1;width:auto}.phone .brand{font-size:24px}@media(max-width:800px){.join-banner{display:block;padding:22px}.join-form{min-width:0;margin-top:20px}.join-form input{flex:1;width:100%}.join-copy h2{font-size:18px}.join-form button{padding:0 17px}.tag-preview{bottom:84px}}
</style><body><div id="screen"><header class="topbar"><a class="brand" href="#"><span class="brand-mark">⚄</span>一局<span class="brand-sub">好友游戏室</span></a><button class="join-top" id="top-join">＃ 加入房间 ↗</button></header><main class="lobby"><div class="intro"><div><span class="eyebrow"><span class="dot"></span>好友到齐，随时开局</span><h1>今天，来玩点什么<span>？</span></h1><p>选一款游戏，邀上朋友。各自一块屏幕，也能围坐一桌。</p></div><div class="small-note"><span>PLAY TOGETHER</span><strong>好玩，在一起。</strong></div></div><section class="join-banner"><div class="join-copy"><span class="join-icon">＃</span><div><h2>朋友已经开好房间？</h2><p>输入朋友发来的房间码，马上加入这一桌。</p></div></div><form class="join-form" id="join-form"><input id="room-code" aria-label="房间码" placeholder="输入 6 位房间码" maxlength="6" autocomplete="off" required pattern="[A-Za-z2-9]{6}"><button class="primary">加入房间 →</button></form></section><div class="demo-status" role="status" id="message"></div><div class="section-line"><h2 id="list-title">全部游戏 <span>5</span></h2><span>♧ 手机 · 电脑，一起玩</span></div><div class="game-grid" id="games"></div><div class="lobby-foot"><span>01 选个游戏</span><i></i><span>02 分享房间</span><i></i><span>03 一起开玩</span><p>无需下载，输入昵称就能加入。</p></div></main><nav class="filter-dock"><div class="dock-inner"><div class="dock-label"><span>今天几个人？<small>选人数，找游戏</small></span></div><div class="filters" id="filters"></div></div></nav></div><div class="tag-preview">独立模拟 · 不创建真实房间 <button class="mobile-toggle" id="mobile">查看手机布局</button></div><script>
const games=[['gomoku','五子棋','GOMOKU','2 人',[2],'策略对弈','黑白之间，先连成五子的人获胜。','sage','约 5–15 分钟'],['landlord','斗地主','DOU DIZHU','3 人',[3],'经典牌局','三人一桌，出好每一手默契。','peach','约 5–10 分钟'],['spy','谁是卧底','UNDERCOVER','3–6 人',[3,4,5,6],'语言推理','一句描述，谁和大家不一样？','lavender','约 10–20 分钟'],['go','围棋','GO / WEIQI','2 人',[2],'围地对弈','落子、提子，在黑白间争得一方天地。','sand','9 / 13 / 19 路'],['checkers','跳棋','CHINESE CHECKERS','2 / 3 / 4 / 6 人',[2,3,4,6],'空跳竞速','借一枚棋子，连跳奔向对面的营地。','sky','约 15–30 分钟']];
function art(id){if(id==='gomoku'||id==='go')return '<div class="mini-board">'+Array.from({length:9},(_,i)=>'<i class="stone s'+i+'"></i>').join('')+'</div>';if(id==='landlord')return '<div class="art-cards"><div class="art-card">A<small>♣</small><b>♣</b></div><div class="art-card red">A<small>♥</small><b>♥</b></div><div class="art-card">A<small>♠</small><b>♠</b></div></div>';if(id==='spy')return '<div class="spy-art"><div class="word-card">你的词语<span>••••</span></div><div class="mystery">?<span>SHH...</span></div><span class="spark">✳</span></div>';return '<div style="text-align:center;padding-top:60px;font-size:120px;color:#77a299;line-height:1">✶</div>'}
function render(n=0){const visible=games.filter(g=>!n||g[4].includes(n));document.getElementById('list-title').innerHTML=(n?n+' 人可以玩':'全部游戏')+' <span>'+visible.length+'</span>';document.getElementById('games').innerHTML=visible.map(g=>'<article class="game-card '+g[7]+'"><div class="game-art"><span class="art-label">'+g[2]+'</span><span class="people-pill">♧ '+g[3]+'</span>'+art(g[0])+'</div><div class="card-body"><div class="game-title"><h3>'+g[1]+'</h3><span>'+g[5]+'</span></div><p>'+g[6]+'</p><div class="card-bottom"><small>'+g[8]+'</small><button onclick="demo()">开一局 ↗</button></div></div></article>').join('');document.getElementById('filters').innerHTML=[0,2,3,4,5,6].map(v=>'<button class="'+(v===n?'active':'')+'" aria-pressed="'+(v===n)+'" onclick="render('+v+')">'+(v?v+'<small>人</small>':'全部')+'</button>').join('')}
function demo(){document.getElementById('message').textContent='这是布局预览，不会创建真实房间。'}document.getElementById('top-join').onclick=()=>{document.getElementById('room-code').scrollIntoView({behavior:'smooth',block:'center'});document.getElementById('room-code').focus({preventScroll:true})};document.getElementById('room-code').oninput=e=>{e.target.value=e.target.value.toUpperCase()};document.getElementById('join-form').onsubmit=e=>{e.preventDefault();document.getElementById('message').textContent='演示：以已保存的昵称「道口的猫」加入房间 '+document.getElementById('room-code').value+'。实际未发送请求。'};document.getElementById('mobile').onclick=e=>{const phone=document.getElementById('screen').classList.toggle('phone');e.target.textContent=phone?'查看电脑布局':'查看手机布局'};render();
</script></body></html>
