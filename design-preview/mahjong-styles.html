<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一局 · 麻将牌面选择</title><style>*{box-sizing:border-box}body{background:#f7f8f1;color:#304b3c;margin:0;font:14px Arial,'Microsoft YaHei',sans-serif}main{max-width:1100px;margin:auto;padding:38px 22px}h1{font-size:29px;margin:0 0 12px}p{color:#7f8b76;font-size:13px;line-height:1.8}section{background:#fff;border:1px solid #e0e5d8;border-radius:20px;margin-top:24px;overflow:hidden}.head{padding:22px 26px}h2{font-size:21px;margin:0 0 8px}.head p{margin:0}.stage{background:#e2ead9;padding:22px 25px}.tiles{display:flex;gap:8px;overflow:auto;padding:17px 5px 12px}.tile{flex-shrink:0;display:grid;place-items:center;width:59px;height:81px;border:1px solid #dedac9;border-bottom:7px solid #7c9b71;background:linear-gradient(110deg,#fffef6,#f2eddb);border-radius:6px;padding:3px;box-shadow:0 4px 5px #334c3028;cursor:pointer;transition:transform .15s}.tile svg{width:100%;height:100%}.tile.selected{transform:translateY(-10px);outline:2px solid #557d40;outline-offset:2px}.caption{font-size:11px;color:#7b8a70;margin:12px 0 0}.rivers{display:flex;gap:8px;align-items:center;padding:14px 5px;overflow:auto}.rivers .tile{width:32px;height:44px;border-bottom-width:4px;border-radius:3px;padding:1px}.rivers .rotated{width:44px;height:32px;border-bottom-width:3px}.rivers .rotated svg{transform:rotate(90deg);width:27px;height:38px}.b .stage{background:#e5edeb}.b .tile{background:#fffefa;border:1px solid #e0e5df;border-bottom:5px solid #75aaa7;border-radius:10px;box-shadow:0 3px 0 #ccddda,0 5px 7px #34595112;padding:5px}.b .tile svg{filter:saturate(.78)}.b .rivers .tile{padding:2px;border-radius:5px;border-bottom-width:3px}.c .stage{background:#dce6d7}.c .tile{background:linear-gradient(100deg,#fff,#fffff7);border:2px solid #fff;border-bottom:8px solid #bd9a54;border-radius:5px;box-shadow:2px 4px 0 #aaaf9555,0 7px 8px #304a2725;padding:1px}.c .tile svg{filter:saturate(1.35) contrast(1.2)}.c .tile svg text{font-weight:900}.c .rivers .tile{border-width:1px;border-bottom-width:4px;padding:0}.badge{display:inline-block;font-size:10px;background:#eef2e7;padding:5px 9px;border-radius:20px;margin-left:10px;font-weight:normal;vertical-align:middle}.footer{margin-top:25px;padding:18px;border:1px solid #dfe5d5;border-radius:12px;font-size:12px;color:#7a8870;background:#fff}button:focus-visible{outline:3px solid #688b4d;outline-offset:3px}@media(max-width:600px){main{padding:25px 12px}.stage{padding:14px 12px}.head{padding:18px}.tile{width:48px;height:67px}.tiles{gap:6px}h1{font-size:25px}h2{font-size:18px}}</style><main><h1>选一副喜欢的麻将牌</h1><p>三种风格使用相同牌面，直接比较清晰度、配色与厚度。点击大牌可体验选中效果；小牌展示弃牌与横放的立直宣言牌。</p><div id="samples"></div><div class="footer">A 偏实体麻将，B 更贴近当前网页的清爽风格，C 强调牌面辨识度。可以选择整套，也可以组合喜欢的牌面和底边颜色。此页只做外观比较。</div></main><script>
function face(t){const suit=t[0],n=+t[1];let shapes='';if(suit==='p'){const positions={1:[[25,32]],2:[[25,17],[25,47]],3:[[14,15],[25,32],[36,49]],4:[[14,17],[36,17],[14,47],[36,47]],5:[[14,15],[36,15],[25,32],[14,49],[36,49]],6:[[14,13],[36,13],[14,32],[36,32],[14,51],[36,51]],7:[[12,11],[25,11],[38,11],[14,30],[36,30],[14,50],[36,50]],8:[[14,10],[36,10],[14,24],[36,24],[14,39],[36,39],[14,53],[36,53]],9:[[12,12],[25,12],[38,12],[12,32],[25,32],[38,32],[12,52],[25,52],[38,52]]}[n];shapes=positions.map(([x,y],i)=>'<circle cx="'+x+'" cy="'+y+'" r="'+(n===1?14:5)+'" fill="none" stroke="'+(n===1||i%3===1?'#b94f43':'#334f76')+'" stroke-width="2.3"/><circle cx="'+x+'" cy="'+y+'" r="'+(n===1?8:1.5)+'" fill="#3b6c53"/>').join('')}else if(suit==='s'){if(n===1){shapes='<path d="M15 54 Q30 47 20 30 Q13 18 26 10 Q33 9 36 17 L43 20 L35 23 Q32 32 37 38 L30 50 Z" fill="#317355"/><path d="M22 29 Q9 26 10 42 Q19 37 25 44" fill="#41618a"/><circle cx="31" cy="16" r="2" fill="#bb5145"/><path d="M23 49 L18 59 M29 49 L28 60" stroke="#b95742" stroke-width="2"/>'}else{for(let i=0;i<n;i++){const cols=n<=3?1:n<=6?2:3,rows=Math.ceil(n/cols),x=25+(i%cols-(cols-1)/2)*13,y=32+(Math.floor(i/cols)-(rows-1)/2)*18;shapes+='<path d="M'+x+' '+(y-6)+'v12 M'+(x-4)+' '+(y-5)+'h8 M'+(x-4)+' '+y+'h8 M'+(x-4)+' '+(y+5)+'h8" stroke="'+(n===5&&i===4?'#b35043':'#286548')+'" stroke-width="3" stroke-linecap="round"/>'}}}else if(suit==='m'){shapes='<text x="25" y="27" text-anchor="middle" font-size="24" fill="#304d61">'+['','一','二','三','四','五','六','七','八','九'][n]+'</text><text x="25" y="56" text-anchor="middle" font-size="27" fill="#b34d40">萬</text>'}else{shapes=n===5?'<rect x="8" y="9" width="34" height="47" rx="2" fill="none" stroke="#496885" stroke-width="2"/>':'<text x="25" y="47" text-anchor="middle" font-size="38" fill="'+(n===6?'#2d7451':n===7?'#b74a40':'#304c60')+'">'+['','東','南','西','北','白','發','中'][n]+'</text>'}return '<svg viewBox="0 0 50 65" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" font-family="serif">'+shapes+'</svg>'}
function label(t){return t[0]==='z'?['','东','南','西','北','白','发','中'][+t[1]]:t[1]+({m:'万',p:'筒',s:'索'}[t[0]])}function tile(t,button=false){const e=document.createElement(button?'button':'span');e.className='tile';e.innerHTML=face(t);e.setAttribute('aria-label',label(t));e.title=label(t);return e}
const samples=[['a','A · 经典象牙牌','暖白牌面、绿色底边，保留实体麻将的厚度和柔和阴影。'],['b','B · 清爽青瓷牌','纯净白底、青色底边、圆润边角，牌面留白更多。'],['c','C · 醒目竞技牌','更大的牌面图案、加粗字牌和金色厚底，小尺寸也更醒目。']];const deck=['m1','m5','m9','p1','p5','p9','s1','s5','s9','z1','z5','z6','z7'];for(const [cls,title,desc] of samples){const sec=document.createElement('section');sec.className=cls;sec.innerHTML='<div class="head"><h2>'+title+'</h2><p>'+desc+'</p></div><div class="stage"><div class="caption">手牌 · 万 / 筒 / 索 / 字牌</div><div class="tiles"></div><div class="caption">牌河 · 第三张横放，表示立直宣言牌</div><div class="rivers"></div></div>';for(const t of deck){const e=tile(t,true);e.setAttribute('aria-pressed','false');e.onclick=()=>{e.classList.toggle('selected');e.setAttribute('aria-pressed',String(e.classList.contains('selected')))};sec.querySelector('.tiles').append(e)}['m9','p3','s5','z4','z7','p8'].forEach((t,i)=>{const e=tile(t);if(i===2){e.classList.add('rotated');e.setAttribute('aria-label',label(t)+'，立直宣言牌')}sec.querySelector('.rivers').append(e)});document.getElementById('samples').append(sec)}
</script></html>
